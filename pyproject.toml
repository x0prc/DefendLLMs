[project]
name = "defendllms"
version = "0.1.0"
description = "Minimal benchmark and guard pipeline for Crescendo-style jailbreak defenses"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.35.0",
    "peft>=0.6.0",
    "datasets>=2.14.0",
    "accelerate>=0.24.0",
    "bitsandbytes>=0.41.0",
    "numpy>=1.24.0",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0",
    "trl>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
